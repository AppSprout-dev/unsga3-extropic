name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install THRML, JAX CPU, kernels extra, and this package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,cpu,kernels]"
      - name: NumPy tests (no THRML, Torx, or deep markers)
        run: python -m pytest -q -m 'not thrml and not torx and not deep'
        env:
          JAX_PLATFORMS: cpu
      - name: Nondominated kernel tests (verbose, including jit)
        run: python -m pytest -v tests/test_nondominated_kernel.py
        env:
          JAX_PLATFORMS: cpu
      - name: Unit tests (core; torx extra and deep benchmarks are separate jobs)
        run: python -m pytest -q -m 'not torx and not deep'
        env:
          JAX_PLATFORMS: cpu
      - name: Codon demo smoke
        run: python demos/run_codon_thrml.py --smoke
        env:
          JAX_PLATFORMS: cpu
      - name: Potts demo smoke
        run: python demos/run_potts_thrml.py --smoke
        env:
          JAX_PLATFORMS: cpu
      - name: Domain-wall Ising smoke
        run: python demos/run_domain_wall.py --smoke
        env:
          JAX_PLATFORMS: cpu

  default-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install default extras without the kernels extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,cpu]"
      - name: Assert numba is not installed and default path imports nothing
        run: |
          python - <<'PY'
          import importlib.util
          import sys
          import numpy as np

          assert importlib.util.find_spec("numba") is None, "numba must not be installed in this job"
          from unsga3_extropic.archive import nondominated_mask
          mask = nondominated_mask(np.array([[0.0, 1.0], [0.5, 0.5], [1.0, 0.0], [0.6, 0.6]]))
          assert mask.tolist() == [True, True, True, False]
          assert "numba" not in sys.modules
          leaked = [
              name
              for name in sys.modules
              if name == "unsga3_extropic.kernels"
              or name.startswith("unsga3_extropic.kernels.")
          ]
          assert not leaked, leaked
          print("default-path import-free: ok")
          PY
        env:
          JAX_PLATFORMS: cpu
      - name: Default-path ranking tests
        run: python -m pytest -q tests/test_archive_weights.py tests/test_niching.py tests/test_default_nd_imports.py
        env:
          JAX_PLATFORMS: cpu

  torx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the optional Torx extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,cpu,torx]"
      - name: Torx PSWAP smoke
        run: |
          python -m pytest -q -m torx
          python demos/run_torx_pswap.py
        env:
          JAX_PLATFORMS: cpu
