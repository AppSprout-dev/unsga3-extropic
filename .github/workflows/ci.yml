name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install THRML, JAX CPU, kernels extra, and this package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,cpu,kernels]"
      - name: NumPy tests (no THRML, Torx, or deep markers)
        run: python -m pytest -q -m 'not thrml and not torx and not deep'
        env:
          JAX_PLATFORMS: cpu
      - name: Nondominated kernel tests (verbose, including jit)
        run: python -m pytest -v tests/test_nondominated_kernel.py
        env:
          JAX_PLATFORMS: cpu
      - name: Unit tests (core; torx extra and deep benchmarks are separate jobs)
        run: python -m pytest -q -m 'not torx and not deep'
        env:
          JAX_PLATFORMS: cpu
      - name: Codon demo smoke
        run: python demos/run_codon_thrml.py --smoke
        env:
          JAX_PLATFORMS: cpu
      - name: Potts demo smoke
        run: python demos/run_potts_thrml.py --smoke
        env:
          JAX_PLATFORMS: cpu
      - name: Domain-wall Ising smoke
        run: python demos/run_domain_wall.py --smoke
        env:
          JAX_PLATFORMS: cpu

  torx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the optional Torx extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,cpu,torx]"
      - name: Torx PSWAP smoke
        run: |
          python -m pytest -q -m torx
          python demos/run_torx_pswap.py
        env:
          JAX_PLATFORMS: cpu
