name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install THRML, JAX CPU, and this package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,cpu]"
      - name: NumPy tests (no THRML or Torx markers)
        run: python -m pytest -q -m 'not thrml and not torx'
        env:
          JAX_PLATFORMS: cpu
      - name: Unit tests (core; torx extra is a separate job)
        run: python -m pytest -q -m 'not torx'
        env:
          JAX_PLATFORMS: cpu
      - name: Codon demo smoke
        run: python demos/run_codon_thrml.py --smoke
        env:
          JAX_PLATFORMS: cpu
      - name: Potts demo smoke
        run: python demos/run_potts_thrml.py --smoke
        env:
          JAX_PLATFORMS: cpu
      - name: Domain-wall Ising smoke
        run: python demos/run_domain_wall.py --smoke
        env:
          JAX_PLATFORMS: cpu

  torx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the optional Torx extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,cpu,torx]"
      - name: Torx PSWAP smoke
        run: |
          python -m pytest -q -m torx
          python demos/run_torx_pswap.py
        env:
          JAX_PLATFORMS: cpu
