name: deep

# On-demand deep benchmarks. Default pull_request / push CI stays on the smoke
# budgets in ci.yml. This job does not commit records; it uploads them.
on:
  workflow_dispatch:

jobs:
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install THRML, JAX CPU, Torx, and this package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,cpu,torx]"
      - name: Deep benchmarks
        run: python benchmarks/run_deep.py
        env:
          JAX_PLATFORMS: cpu
      - name: Upload deep records
        uses: actions/upload-artifact@v4
        with:
          name: deep-benchmark-records
          path: |
            benchmarks/records/runs.jsonl
            benchmarks/DEEP_RESULTS.md
            benchmarks/records/torx_pswap_deep.json
