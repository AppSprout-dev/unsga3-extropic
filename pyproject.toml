[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unsga3-extropic"
version = "0.5.0"
description = "Weight-sweep multiobjective search on THRML Ising and Potts sampling, with a domain-wall Ising image of the Potts chain, reference-direction niching, an exact E_w Metropolis fallback, and an optional Torx circuit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "AppSprout" }]
keywords = ["unsga-iii", "multi-objective", "thrml", "extropic", "ising", "potts", "torx"]
dependencies = [
  "thrml>=0.1.4",
  "numpy>=1.24",
]
# JAX is a peer dependency (THRML pattern). Install jax separately for your platform.

[project.optional-dependencies]
dev = ["matplotlib>=3.8", "pytest>=8.0"]
cpu = ["jax[cpu]>=0.4.30"]
# extro-torx requires Python >= 3.11. It is not a core dependency.
# `pip install -e .` on Python 3.10 does not install it.
torx = ["extro-torx>=0.0.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/unsga3_extropic"]

[tool.hatch.build]
sources = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "thrml: requires the thrml and jax packages",
  "torx: requires the extro-torx extra (Python >= 3.11)",
  "deep: on-demand multi-seed benchmark (benchmarks/run_deep.py); excluded from default CI",
]
